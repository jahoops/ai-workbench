[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench"
version = "0.1.0"
description = "A local, model-independent coding workstation"
requires-python = ">=3.11"
dependencies = ["flet>=0.24,<1", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-workbench = "ai_workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
